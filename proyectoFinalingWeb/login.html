  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <h1>Bienvenido</h1>
      <p class="subtitle">Ingresa tus credenciales</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
          <input type="email" id="email" placeholder="usuario@correo.com" autocomplete="email"/>
        </div>
        <p class="error-msg" id="emailError">Ingresa un correo válido.</p>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Ver contraseña">
            <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="error-msg" id="passwordError">La contraseña debe tener al menos 6 caracteres.</p>
      </div>

      <div class="extras">
        <label class="remember">
          <input type="checkbox" id="remember"> Recordarme
        </label>
        <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="btn-text">Iniciar Sesión</span>
        <div class="btn-spinner" id="spinner"></div>
      </button>
    </form>

    <div class="divider"><span>o</span></div>

    <div class="card-footer">
      ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="login.js"></script>
</body>
</html>
