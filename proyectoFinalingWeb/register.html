<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear Cuenta</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+CiAgPHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiBmaWxsPSIjMGEwYTBmIi8+CiAgPHJlY3QgeD0iMSIgeT0iMSIgd2lkdGg9IjMwIiBoZWlnaHQ9IjMwIiBmaWxsPSJub25lIiBzdHJva2U9IiM3YzdjZmYiIHN0cm9rZS13aWR0aD0iMC41IiBvcGFjaXR5PSIwLjQiLz4KICA8Y2lyY2xlIGN4PSIxMyIgY3k9IjEyIiByPSI0IiBmaWxsPSJub25lIiBzdHJva2U9IiNhMGEwZmYiIHN0cm9rZS13aWR0aD0iMS41Ii8+CiAgPHBhdGggZD0iTTUgMjZ2LTJhNiA2IDAgMCAxIDkuNS00LjkiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzdjN2NmZiIgc3Ryb2tlLXdpZHRoPSIxLjUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPgogIDxsaW5lIHgxPSIyMyIgeTE9IjE4IiB4Mj0iMjMiIHkyPSIyNiIgc3Ryb2tlPSIjYTBhMGZmIiBzdHJva2Utd2lkdGg9IjEuOCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+CiAgPGxpbmUgeDE9IjE5IiB5MT0iMjIiIHgyPSIyNyIgeTI9IjIyIiBzdHJva2U9IiNhMGEwZmYiIHN0cm9rZS13aWR0aD0iMS44IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz4KPC9zdmc+Cg==">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos específicos del registro */
    .card { max-width: 440px; }

    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .strength-wrap { margin-top: 8px; }
    .strength-wrap.show { display: block; }

    .strength-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
    }
    .strength-bar span {
      flex: 1;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      transition: background 0.3s;
    }
    .strength-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 24px;
      animation: fadeUp 0.5s 0.42s cubic-bezier(0.16,1,0.3,1) both;
    }
    .terms input[type="checkbox"] {
      width: 14px; height: 14px;
      margin-top: 1px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .terms a {
      color: var(--accent-bright);
      text-decoration: none;
    }
    .terms a:hover { opacity: 0.7; }

    @media (max-width: 480px) {
      .name-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <h1>Crear Cuenta</h1>
      <p class="subtitle">Completa tu información</p>
    </div>

    <form id="registerForm" novalidate>

      <!-- Nombre y apellido -->
      <div class="form-group name-row">
        <div>
          <label for="firstName">Nombre</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="firstName" placeholder="Juan" autocomplete="given-name"/>
          </div>
          <p class="error-msg" id="firstNameError">Campo requerido.</p>
        </div>
        <div>
          <label for="lastName">Apellido</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="lastName" placeholder="Pérez" autocomplete="family-name"/>
          </div>
          <p class="error-msg" id="lastNameError">Campo requerido.</p>
        </div>
      </div>

      <!-- Correo -->
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
          <input type="email" id="email" placeholder="usuario@correo.com" autocomplete="email"/>
        </div>
        <p class="error-msg" id="emailError">Ingresa un correo válido.</p>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" placeholder="Mín. 8 caracteres" autocomplete="new-password"/>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Ver contraseña">
            <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength-wrap" id="strengthWrap">
          <div class="strength-bar">
            <span id="s1"></span>
            <span id="s2"></span>
            <span id="s3"></span>
            <span id="s4"></span>
          </div>
          <p class="strength-label" id="strengthLabel"></p>
        </div>
        <p class="error-msg" id="passwordError">Mínimo 8 caracteres.</p>
      </div>

      <!-- Confirmar contraseña -->
      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" autocomplete="new-password"/>
          <button type="button" class="toggle-pw" id="toggleConfirm" aria-label="Ver contraseña">
            <svg id="eyeIconConfirm" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="error-msg" id="confirmError">Las contraseñas no coinciden.</p>
      </div>

      <!-- Términos -->
      <div class="terms">
        <input type="checkbox" id="terms">
        <label for="terms" style="cursor:pointer;">
          Acepto los <a href="terms.html" target="_blank" rel="noopener">Términos de Servicio</a> y la <a href="privacy.html" target="_blank" rel="noopener">Política de Privacidad</a>
        </label>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="btn-text">Crear Cuenta</span>
        <div class="btn-spinner" id="spinner"></div>
      </button>
    </form>

    <div class="divider"><span>o</span></div>

    <div class="card-footer">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="register.js"></script>
</body>
</html>
