<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5 Ejemplos Evento Click</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    section {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
    }
    button {
      padding: 8px 14px;
      cursor: pointer;
    }

    .center{
        text-align: center;
    }
  </style>
</head>
<body>

  <h1 class="center">Ejemplos del Evento Click en JavaScript</h1>

  <!-- 1 Mostrar mensaje -->
  <section>
    <h3>1. Mostrar mensaje</h3>
    <button id="btn1">Mostrar mensaje</button>
    <p id="texto"></p>
  </section>

  <!-- 2 Contador de clics -->
  <section>
    <h3>2. Contador de clics</h3>
    <button id="btn2">Clics: 0</button>
  </section>

  <!-- 3 Cambiar color de fondo -->
  <section>
    <h3>3. Cambiar color de fondo</h3>
    <button id="btn3">Cambiar color</button>
  </section>

  <!-- 4 Mostrar alerta -->
  <section>
    <h3>4. Mostrar alerta</h3>
    <button id="btn4">Mostrar alerta</button>
  </section>

  <!-- 5 Ocultar elemento -->
  <section>
    <h3>5. Ocultar texto</h3>
    <button id="btn5">Ocultar texto</button>
    <p id="parrafo">Este texto se puede ocultar</p>
  </section>

  <script src = "ejemplosclick.js"></script>

</body>
</html>
