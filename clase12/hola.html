<!DOCTYPE html>
<html>
<head>
<title>Ejemplo Change</title>
</head>
<style>
    .Manzana {
  background-color: gray; /* Estado apagado */
  color: white;
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.Banano {
  background-color: gray; /* Estado apagado */
  color: white;
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.Fresa {
  background-color: gray; /* Estado apagado */
  color: white;
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
}
    .Manzana:hover {
  background-color: green;
  box-shadow: 0 0 20px green; /* Luz */
  transform: scale(1.1); /* Crece */
}
    .Banano:hover {
  background-color: yellow;
  box-shadow: 0 0 20px yellow; /* Luz */
  transform: scale(1.1); /* Crece */
}
    .Fresa:hover {
  background-color: red;
  box-shadow: 0 0 20px red; /* Luz */
  transform: scale(1.1); /* Crece */
}
</style>
<body>

<h2>Elige tu fruta favorita</h2>

<h1>Selecciona una fruta</h1>
<button class="Manzana">Manzana</option>
<button class="Banano">Banano</option>
<button class="Fresa">Fresa</option>

</body>
</html>
